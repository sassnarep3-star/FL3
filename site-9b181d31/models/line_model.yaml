policy:
  publish_rule: "a row is published only with a source_id that exists in data/sources.csv; blank + flag otherwise"
  abstain_rule: "bet only if |model - market| > vig + measured model error band (S-25); with no market
    column the rule always abstains"
  rounding: "prices published to 0.5, probabilities to 3 dp, never to a precision the inputs do not support"
  parameter_sealing: "models/*.yaml is committed before a week's predictions are made (gate G-12)"
  luck_removal: "grade log-loss and CLV first, P&L last; rewards paid on the skill score, never on raw ROI (S-24)"
