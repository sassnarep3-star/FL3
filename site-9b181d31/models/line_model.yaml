    - team_pass_off_2026.pass_td                        # FLG-025
    - team_pass_off_2026.pass_int                       # FLG-025
    - team_pass_def_2026.opp_pass_td                    # FLG-025
    - team_pass_def_2026.opp_int_forced                 # FLG-025
    - "11 unlabelled stat columns"                      # FLG-014

