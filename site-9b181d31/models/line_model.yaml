# Line origination model - parameter register
#
# CONTRACT
#   Any parameter with status `uncalibrated` or `blocked` MUST render as BLANK on the site
#   and may not be used in a published price. A value may only be entered here when its
#   `evidence` points at a row in data/ that passed scripts/verify.py (gate G-10).
#   Filling a value by memory, by "industry standard", or by a model output that was not
#   fitted on data in this repo is a G-12 violation (parameter sealing).
#
# This file is machine-read by scripts/build_site.py (models page) and is the single
# authority for what the model believes.

meta:
  version: "0.3"
  updated_utc: "2026-11-14T06:00:00Z"
  session: S1-b37bd750
  fitted_by: scripts/model.py
  calibration_table: data/model_calibration.csv
  verification: scripts/verify.py

pipeline:
  ingest:      scripts/fetch_nfl_data.py     # untested in this sandbox - FLG-024
  verify:      scripts/verify.py             # gate G-10; exit 1 blocks publish
  derive:      scripts/model.py              # metrics, league stats, correlations
  calibrate:   scripts/model.py              # beta / alpha / sigma / gamma on verified games
  rate:        scripts/model.py              # power_ratings.csv
  price:       scripts/model.py              # lines_origination.csv
  thresholds:  scripts/stats_tables.py        # decision_math.csv (closed form)
  board:       scripts/make_leaderboard.py
  publish:     scripts/build_site.py
  link_check:  scripts/check_links.py

data_inputs:
