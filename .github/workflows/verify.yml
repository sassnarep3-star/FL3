name: Verify data and site

# GitHub Pages for this repo deploys from the `main` branch root using the
# legacy builder (already configured). This workflow is the gate: it recomputes
# every model, rebuilds the site, and fails on any broken link, missing source,
# arithmetic error, or non-reproducible output.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Recompute and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Recompute models from committed data
        run: |
          python3 scripts/compute_lines.py
          python3 scripts/compute_luck.py
          python3 scripts/compute_correlation.py

      - name: Rebuild the verified corpus, evaluation and register
        run: |
          python3 scripts/build_week_results.py
          python3 scripts/score_lines.py
          python3 scripts/verify_live.py
          python3 scripts/build_verified_site.py

      - name: Rebuild the site
        run: python3 scripts/build_site.py

      # The comparison lab reads only committed data and is deterministic (fixed bootstrap seed),
      # so CI re-runs it and then requires the committed output to reproduce. Its own --check is
      # also invoked from inside check_site.py (check S), so a drift fails twice rather than once.
      - name: Rebuild the strategy comparison lab and corpus reconciliation
        run: |
          python3 scripts/build_compare.py
          python3 scripts/build_crosscheck.py

      - name: Verify data, links and arithmetic (root site + comparison lab)
        run: python3 scripts/check_site.py

      # R010: backtest-origin numbers may never appear on the prospective leaderboard.
      - name: Enforce leaderboard governance (no backtest numbers on the prospective board)
        run: python3 scripts/check_leaderboard_governance.py

      - name: Verify the canonical verified dashboard
        run: python3 scripts/check_verified_site.py

      - name: Build and verify the official-source verification subsite
        run: |
          python3 scripts/build_verify.py
          python3 scripts/check_verify.py

      - name: Build and verify the requirement-coverage audit
        run: |
          python3 scripts/build_coverage_audit.py
          python3 scripts/check_coverage_audit.py

      - name: Official-report snapshot - offline capture tests, parser and row-by-row readings check
        run: |
          python3 scripts/test_capture_offline.py
          python3 scripts/capture_official_snapshot.py --selftest
          python3 scripts/parse_official_snapshot.py --week 11
          python3 scripts/check_official_readings.py 11
      - name: Confirm generated files are reproducible
        run: |
          if ! git diff --quiet; then
            echo "::error::Generated files differ from the committed versions."
            git diff --stat
            exit 1
          fi
          echo "Generated files are reproducible."
