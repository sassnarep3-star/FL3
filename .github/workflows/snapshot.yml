name: Official injury-report snapshot

# Captures the official NFL.com injury report (Wed-Sun, twice a day; see the cron block) and commits
# one immutable, hashed file per capture under snapshots/. The store lives outside data/ and
# docs/ so that the site-verification job (which diffs data/ and docs/) is not triggered by it.
#
# Normal non-capture outcomes are recorded, not alarmed:
#   - a not-yet-published week URL redirects to the current week -> index row "redirected:<week>"
#   - a published page with no player rows yet                   -> index row "empty"
# Drift alarm: scripts/capture_official_snapshot.py exits 2 when the page does not look like the
# report we parse (HTTP status, size, required headings, or a challenge-shaped body). That fails
# this workflow, and GitHub notifies the repository owner of the failed run. Nothing is committed
# on failure. The failure log prints the HTTP status and the first 300 body characters.
#
# Week: the scheduled runs use REPORT_WEEK below. Update it when the season moves to a new week
# (the workflow_dispatch input overrides it for a single run).

on:
  schedule:
    # Morning slot runs Wed-Sun (report days through pre-kickoff Sunday);
    # evening slot runs Wed-Sat (the day's final designations). Sunday evening and
    # Monday are excluded: the next week's report does not exist until Wednesday and
    # the league site redirects to the current week, which the capture records as
    # "redirected" without storing anything.
    - cron: "17 13 * * 3,4,5,6,0"
    - cron: "17 23 * * 3,4,5,6"
  # Self-test: any commit that touches the capture script runs one live capture,
  # so a change to the fetch/drift logic is verified against the real page instead
  # of only offline. The paths filter prevents loops (the workflow commits only
  # under snapshots/).
  push:
    paths:
      - "scripts/capture_official_snapshot.py"
      - ".github/workflows/snapshot.yml"
  workflow_dispatch:
    inputs:
      week:
        description: "NFL week number to capture"
        required: false
        default: "11"

permissions:
  contents: write

concurrency:
  group: official-snapshot
  cancel-in-progress: false

env:
  REPORT_WEEK: "11"

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test capture and drift-classification logic offline
        run: python3 scripts/test_capture_offline.py

      - name: Capture the report (fails loudly on drift)
        run: |
          WEEK="${{ inputs.week }}"
          if [ -z "$WEEK" ]; then WEEK="$REPORT_WEEK"; fi
          python3 scripts/capture_official_snapshot.py --week "$WEEK"

      - name: Commit the new capture
        run: |
          git config user.name "fl3-snapshot-bot"
          git config user.email "fl3-snapshot-bot@users.noreply.github.com"
          git add snapshots/
          if git diff --cached --quiet; then
            echo "nothing new to commit"
            exit 0
          fi
          git commit -m "snapshot: official injury report ($(date -u +%Y-%m-%dT%H:%MZ))"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
