name: site

# What this workflow is
#
# GitHub Pages for this repo is configured as **legacy branch build: `main` / `docs`** (that is the
# state of the repo, and the token available during authoring could not change it - see FLG-027).
# So Pages publishes `board/` directly, and this workflow is the gate that protects it: `board/` is a
# build artefact of `data/`, and a commit whose artefact does not match its data - or whose data fails
# an identity check - must never land on `main`.
#
# If the owner later switches Pages to "GitHub Actions" in Settings -> Pages, add back
# `actions/upload-pages-artifact` (path: docs) + `actions/deploy-pages`, plus the
# `permissions: {pages: write, id-token: write}` block, and the rest of this file is unchanged.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: regenerate every derived file from data/
        run: |
          python3 scripts/model.py
          python3 scripts/stats_tables.py
          python3 scripts/make_leaderboard.py

      - name: gate G-10 - source integrity (exit 1 blocks the publish)
        run: python3 scripts/verify.py

      - name: rebuild the site
        run: python3 scripts/build_board.py --check

      - name: internal links, anchors, orphan pages, source registry
        run: |
          python3 scripts/check_links.py

      - name: fail if the committed docs/ is stale relative to data/
        run: |
          git add -A
          if ! git diff --cached --quiet -- docs/ data/; then
            echo "::error::committed board/ or data/ does not match what the pipeline generates - run:"
            echo "::error::  python3 scripts/model.py && python3 scripts/build_board.py"
            git --no-pager diff --cached --stat -- docs/ data/
            exit 1
          fi
        env:
          GIT_AUTHOR_NAME: ci
          GIT_COMMITTER_NAME: ci

      - name: summary
        run: |
          {
            echo "### Site build check";
            echo;
            echo "- pages: $(ls docs/*.html | wc -l)";
            echo "- data tables: $(ls data/*.csv | wc -l)";
            echo "- verification: gate G-10 passed (see data/verification_report.csv)";
            echo "- docs/ reproduced byte-for-byte from data/";
          } >> "$GITHUB_STEP_SUMMARY"
