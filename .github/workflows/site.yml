name: site

# Pages is deployed FROM THIS WORKFLOW (actions/deploy-pages), not from a "deploy from /docs"
# setting, so the publish chain below is the gate: a broken build cannot become the live site.

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "content/**"
      - "docs/**"
      - "models/**"
      - "scripts/**"
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # regenerate everything from data/ - the committed docs/ is an artefact, not a source
      - name: derive, calibrate, verify, build
        run: |
          python3 scripts/model.py
          python3 scripts/stats_tables.py
          python3 scripts/make_leaderboard.py
          python3 scripts/verify.py          # exits non-zero on a blocking integrity failure (G-10)
          python3 scripts/build_site.py --check
          python3 scripts/check_links.py
      - name: fail if the committed site is stale relative to data/
        run: |
          if [ -n "$(git status --porcelain docs/)" ]; then
            echo "::error::docs/ does not match data/ - run: python3 scripts/build_site.py"
            git --no-pager diff --stat docs/
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.out.outputs.page_url }}
    steps:
      - id: out
        uses: actions/deploy-pages@v4
