# Leaderboard specification
# The board is generated by scripts/make_leaderboard.py from models/strategy_registry.yaml plus the
# bet ledger (which does not exist yet - see Q-01/Q-17). This file is the scoring and reward contract.

meta:
  version: "0.1"
  updated_utc: "2026-11-14T06:00:00Z"
  output: data/leaderboard.csv
  gates_spec: models/gates.yaml

scoring:
  formula: |
    skill_score =  0.35 * z(-log_loss_vs_market)
                 + 0.35 * z(mean_clv_points)
                 + 0.25 * sign(luck_adjusted_roi) * min(1, bets / n_min)
                 - 0.05 * (max_drawdown / drawdown_limit)
                 - penalty(gate_breaches)
  design_rules:
    - "prediction quality is scored before profit, because it is measurable on ~200 bets where ROI needs thousands"
    - "profit enters only sample-weighted; a 40-bet +18% never outranks a 900-bet +4%"
    - "z-scores are computed across the catalogue in the same week, so the board cannot be gamed by a
       single lucky window (that is what min(1, bets/n_min) is for)"
    - "no raw ROI column is ever the sort key"
  n_min_source: "models/gates.yaml thresholds.n_min_bets (floor 400; the honest number is 2,169 for a
    3-point edge at -110 - see data/decision_math.csv)"

rewards:
  pool_split:
    season_skill_score: 0.60
    improvement_in_skill_score: 0.25     # lets a new strategy earn without an all-time record
    best_documented_negative: 0.15       # pays for killing a popular signal with evidence
  share_cap_per_strategy: 0.25
  eligibility:
    - "tier >= paper for the full evaluation window"
    - "G-10 passed on every week's data used"
    - "config sealed before the week's predictions (G-12)"
    - "minimum 1 full season of live-in-time prediction, not backtest only"
  payment: "reputation first, funded-tier allocation second; no reward is paid on an unsealed config"

board_columns:
  - strategy_id
  - strategy
  - tier
  - bets
  - beats_close_pct
  - mean_clv_pts
  - log_loss_vs_market
  - roi_units          # displayed, never sorted on
  - luck_adjusted_roi  # gate G-13
  - max_drawdown
  - gate_status
  - status

anti_gaming:
  - id: AG-1
    rule: "parameter changes mid-window void the standing"
  - id: AG-2
    rule: "results may not be reported on a hand-picked window; the week is the unit (G-09)"
  - id: AG-3
    rule: "a strategy that only fires on games it already knows the score of is a G-02 failure"
  - id: AG-4
    rule: "same-causal-driver positions count as one bet for exposure and for the board (G-08)"
  - id: AG-5
    rule: "any cell this pipeline cannot fill stays blank; a blank is a valid leaderboard entry and an
      invented number is not"
